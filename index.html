<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestione Turni Medici</title><style>:root{--b:#123a67;--b2:#1d5b93;--bg:#f4f7fb;--line:#d7e0ea;--man:#dff3ff;--auto:#e5f6e8}*{box-sizing:border-box}body{margin:0;font:14px system-ui,Segoe UI,Arial;background:var(--bg);color:#172033}header{background:var(--b);color:#fff;padding:14px 18px;display:flex;gap:14px;align-items:center;position:sticky;top:0;z-index:20}header h1{font-size:18px;margin:0;flex:1}button{border:1px solid #b9c8d8;background:#fff;padding:8px 12px;border-radius:7px;cursor:pointer}.primary{background:var(--b2);color:#fff;border-color:var(--b2)}.success{background:#16834b;color:#fff;border-color:#16834b}.danger{color:#a21b1b}.wrap{padding:18px}.card,.toolbar{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hidden{display:none!important}.gridwrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;max-height:calc(100vh - 260px);padding-bottom:18px}table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;min-width:120px;vertical-align:top}th{background:#eaf1f8;position:sticky;top:0;z-index:4;font-size:12px}.manual select{background:var(--man)}.auto select{background:var(--auto)}.cell{display:flex;gap:4px;flex-direction:column}.leaveCell{display:grid;grid-template-columns:1fr 1fr;gap:3px}.leaveCell select{background:#f0d9ff;padding:3px;font-size:11px}.notice{padding:10px;border-radius:7px;background:#eef6ff;margin-bottom:12px}.modalBack{position:fixed;inset:0;background:#10243b88;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}.modal{width:min(1200px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:12px;padding:20px}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.printOnly{display:none}</style></head><body><div id="loginView" class="hidden"></div><div id="pendingView" class="hidden"></div><div id="app" class="hidden"><header><h1>OSPEDALE · Gestione Turni Medici <small>online</small></h1><div class="tabs"><button id="tabTurni" class="active">Turni mensili</button><button id="tabMedici">Archivio medici</button><button id="tabUtenti" class="hidden">Gestione utenti</button></div><span id="loggedUser"></span><span id="sync">Firebase</span><button id="logout">Esci</button></header><main class="wrap"><section id="turni"><div class="toolbar"><button id="prev">◀</button><input id="month" type="month" style="width:auto"><button id="next">▶</button><button class="primary adminOnly" id="generate">Genera bozza</button><button class="success" id="openLeave">Inserisci ferie</button><button id="countBtn">Conteggio turni</button><button id="annualCountBtn">Conteggio annuale</button><button id="printBtn">STAMPA</button><button class="danger adminOnly" id="clearDraft">Cancella bozza</button></div><div class="notice adminOnly"><b>Prima di Genera bozza:</b> inserire manualmente Guardia Notturna, Giorno e tutti i turni di sabato e domenica. La generazione automatica non modifica il weekend.</div><div id="printTitle" class="printOnly"></div><div class="gridwrap" id="gridwrap"><table id="schedule"></table></div></section><section id="medici" class="hidden"><table id="doctorsTable"></table><form id="doctorForm"><input id="dName"><select id="dCat"><option>Strutturato</option><option>Contratto</option><option>Direttore</option><option>Internista</option></select><input id="dHours" type="number"><select id="dActive"><option value="true">Attivo</option><option value="false">Non attivo</option></select><input id="dNotes"><button>Salva medico</button></form><button id="cancelEdit">Annulla</button></section><section id="utenti" class="hidden"><table id="usersTable"></table></section></main></div><div id="leaveModal" class="modalBack hidden"><div class="modal"><select id="leaveDoctor"></select><input id="leaveStart" type="date"><input id="leaveEnd" type="date"><div class="modalActions"><button id="cancelLeave">Annulla</button><button id="removeLeave">Togli ferie</button><button id="confirmLeave">Conferma ferie</button></div></div></div><div id="countModal" class="modalBack hidden"><div class="modal"><h2 id="countTitle">Conteggio turni</h2><p id="countInfo"></p><table id="countTable"></table><button id="closeCount">Chiudi</button></div></div><script type="module" src="./app.js"></script><script type="module" src="./counts-refresh.js"></script><script type="module" src="./scheduler-fixes.js"></script></body></html>
