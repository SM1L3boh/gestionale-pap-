name: Deploy Firestore Index Exemptions

on:
  push:
    branches:
      - main
    paths:
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.github/workflows/firestore-indexes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-indexes
  cancel-in-progress: true

jobs:
  deploy-indexes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TURNIDOLORT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore index configuration
        run: firebase deploy --only firestore:indexes --project turnidolort --non-interactive
