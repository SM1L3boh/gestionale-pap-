name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Piccolo debounce: durante una serie di modifiche ravvicinate il job
      # precedente viene cancellato dalla concurrency prima di pubblicare
      # una versione intermedia del gestionale.
      - name: Attendi versione stabile
        run: sleep 12

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TURNIDOLORT }}
          channelId: live
          projectId: turnidolort
